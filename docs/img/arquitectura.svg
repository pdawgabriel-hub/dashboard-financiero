</text><text x="1000" y="121" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">(12 entidades)</text><text x="1000" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">coherentes entre sí</text><rect x="988" y="436" width="184" height="80" rx="7" fill="#ffffff" stroke="#1a7f37" stroke-width="1.4"/><text x="1000" y="457" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="start">Primera visita</text><text x="1000" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">siembra cada clave</text><text x="1000" y="491" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">vacía de localStorage</text><path d="M 1080,162 L 1080,434" fill="none" stroke="#6e7781" stroke-width="1.6" marker-end="url(#punta)"/><path d="M 986,476 L 932,476" fill="none" stroke="#6e7781" stroke-width="1.6" marker-end="url(#punta)"/><text x="600" y="612" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606a" font-weight="normal" text-anchor="middle">Sin backend ni base de datos: todo ocurre en el navegador de quien abre la demo, y cada visitante tiene sus propios datos.</text></svg>